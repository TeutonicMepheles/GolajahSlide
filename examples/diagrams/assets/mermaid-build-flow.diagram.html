<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GolajahSlide 图表构建流程</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #111111; }
    body { display: grid; place-items: center; padding: 24px; }
    svg { display: block; width: min(100%, 1840px); height: auto; background: #FFFFFF; }
  </style>
</head>
<body>
  <svg id="diagram-build-flow" viewBox="0 0 1840 800" role="img"
       aria-labelledby="diagram-build-flow-title diagram-build-flow-desc"
       xmlns="http://www.w3.org/2000/svg">
    <title id="diagram-build-flow-title">GolajahSlide 图表构建流程</title>
    <desc id="diagram-build-flow-desc">Markdown 图表定义进入编辑式重绘，通过质量门禁后以内联 SVG 交付；失败则返回定义继续修改。</desc>
    <defs>
      <marker id="diagram-build-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 Z" fill="#5B5965"/>
      </marker>
      <marker id="diagram-build-arrow-accent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 Z" fill="#6F60E5"/>
      </marker>
    </defs>
    <rect width="1840" height="800" fill="#FFFFFF"/>

    <text x="72" y="100" fill="#5B5965" font-size="28" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AUTHORING · 保留语义</text>
    <line x1="72" y1="124" x2="744" y2="124" stroke="#D7D6DD" stroke-width="2"/>
    <text x="1096" y="100" fill="#5B5965" font-size="28" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DELIVERY · 离线交付</text>
    <line x1="1096" y1="124" x2="1768" y2="124" stroke="#D7D6DD" stroke-width="2"/>

    <!-- Connectors precede nodes so every line stays behind its endpoints. -->
    <path d="M344 344 H432" fill="none" stroke="#5B5965" stroke-width="3"
          marker-end="url(#diagram-build-arrow)"/>
    <path d="M736 344 H784" fill="none" stroke="#5B5965" stroke-width="3"
          marker-end="url(#diagram-build-arrow)"/>
    <path d="M1056 344 H1120" fill="none" stroke="#6F60E5" stroke-width="3"
          marker-end="url(#diagram-build-arrow-accent)"/>
    <path d="M1384 344 H1472" fill="none" stroke="#5B5965" stroke-width="3"
          marker-end="url(#diagram-build-arrow)"/>
    <path d="M920 452 V584 A12 12 0 0 1 908 596 H224 A12 12 0 0 1 212 584 V408"
          fill="none" stroke="#5B5965" stroke-width="3" stroke-dasharray="12 10"
          marker-end="url(#diagram-build-arrow)"/>

    <rect x="1068" y="290" width="96" height="36" fill="#FFFFFF"/>
    <text x="1116" y="318" text-anchor="middle" fill="#4C3BC6" font-size="28" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通过</text>
    <rect x="512" y="546" width="96" height="36" fill="#FFFFFF"/>
    <text x="560" y="574" text-anchor="middle" fill="#5B5965" font-size="28" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败</text>

    <rect x="72" y="280" width="272" height="128" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="208" y="334" text-anchor="middle" fill="#111111" font-size="34" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Markdown</text>
    <text x="208" y="376" text-anchor="middle" fill="#5B5965" font-size="28" font-weight="500"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图表定义</text>

    <rect x="432" y="280" width="304" height="128" rx="8" fill="#F8F7FC" stroke="#5B5965" stroke-width="2"/>
    <text x="584" y="334" text-anchor="middle" fill="#111111" font-size="34" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编辑式重绘</text>
    <text x="584" y="376" text-anchor="middle" fill="#5B5965" font-size="28" font-weight="500"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HTML · inline SVG</text>

    <polygon points="920,236 1056,344 920,452 784,344" fill="#F0EEFF" stroke="#6F60E5" stroke-width="3"/>
    <text x="920" y="334" text-anchor="middle" fill="#4C3BC6" font-size="34" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">质量门禁</text>
    <text x="920" y="376" text-anchor="middle" fill="#5B5965" font-size="28" font-weight="500"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">字号 · 边距 · 来源</text>

    <rect x="1120" y="280" width="264" height="128" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="1252" y="334" text-anchor="middle" fill="#111111" font-size="34" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内联 SVG</text>
    <text x="1252" y="376" text-anchor="middle" fill="#5B5965" font-size="28" font-weight="500"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">清洗 · ID 隔离</text>

    <rect x="1472" y="280" width="296" height="128" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="1620" y="334" text-anchor="middle" fill="#111111" font-size="34" font-weight="700"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">清晰 Slide</text>
    <text x="1620" y="376" text-anchor="middle" fill="#5B5965" font-size="28" font-weight="500"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单文件 · 零网络</text>

    <text x="920" y="712" text-anchor="middle" fill="#85828E" font-size="28" font-style="italic" font-weight="500"
          font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语义留在 Mermaid，视觉决策留在可审查的 HTML/SVG</text>
  </svg>
</body>
</html>
